# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn test

  sast:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      scan_outcome: ${{ steps.snyk.outcome }}
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - name: Run Snyk Code scan
      id: snyk
      uses: snyk/actions/maven@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: code test
        args: --sarif-file-output=snyk-code.sarif
    - name: Upload Snyk Code results to GitHub Code Scanning
      if: hashFiles('snyk-code.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk-code.sarif
        category: snyk-code

  # Telegram: default failure-only. Set Actions variable TELEGRAM_NOTIFY_ON=always to notify on pass too.
  notify-sast:
    name: Notify Telegram (SAST)
    runs-on: ubuntu-latest
    needs: sast
    if: >
      always() &&
      needs.sast.result != 'skipped' &&
      needs.sast.result != 'cancelled' &&
      (vars.TELEGRAM_NOTIFY_ON == 'always' || needs.sast.outputs.scan_outcome == 'failure')
    steps:
    - name: Send Telegram notification
      uses: appleboy/telegram-action@v1
      with:
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        message: |
          SAST ${{ needs.sast.outputs.scan_outcome == 'success' && 'PASSED' || 'FAILED' }} (Snyk Code)

          Status: ${{ needs.sast.outputs.scan_outcome }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
          Workflow: ${{ github.workflow }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    name: CD - Build image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}

  container-scan:
    name: Container scan (Snyk)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Pull image for scanning
      run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
    - name: Run Snyk Container scan
      id: snyk-container
      uses: snyk/actions/docker@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: ghcr.io/${{ github.repository }}:${{ github.sha }}
        args: --file=Dockerfile --sarif-file-output=snyk-container.sarif
    - name: Upload Snyk Container results to GitHub Code Scanning
      if: hashFiles('snyk-container.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: snyk-container.sarif
        category: snyk-container
    - name: Notify Telegram on container scan complete
      if: >
        always() &&
        steps.snyk-container.outcome != 'skipped' &&
        (vars.TELEGRAM_NOTIFY_ON == 'always' || steps.snyk-container.outcome == 'failure')
      uses: appleboy/telegram-action@v1
      with:
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        message: |
          Container scan ${{ steps.snyk-container.outcome == 'success' && 'PASSED' || 'FAILED' }} (Snyk)

          Status: ${{ steps.snyk-container.outcome }}
          Image: ghcr.io/${{ github.repository }}:${{ github.sha }}
          Repo: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Actor: ${{ github.actor }}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

